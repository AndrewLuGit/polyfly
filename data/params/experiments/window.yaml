# --- A wall with a window: the payload has to be swung through the opening -----------------
#
# The window is 0.70 m wide and 0.83 m tall, so its clear height (height - 2 * margin) is
# 0.63 m.  The payload hangs 0.617 m below the quadrotor -- cable 0.567 plus half the robot
# height -- so the pair stands 0.717 m tall with the cable vertical and cannot pass: at every
# station inside the wall there is no payload position that clears it, which
# tests/window_swing_check.py proves against the planner's own collision geometry.
#
# What fits instead is the pair *leaned*: the cable at ~45 deg or more, which brings the
# stack down to 0.717*cos(45) + 0.15*sin(45) = 0.61 m.  The lean is not free -- the cable
# direction is fixed instant by instant by the payload's acceleration, -(a + g e_z) -- so a
# 48 deg lean means accelerating the payload at 11 m/s^2, and it has to hold while the
# quadrotor is inside the wall: 0.6 m of travel, from where the wall's inflated span reaches
# the quadrotor's box to where it leaves the payload's.
#
# This scenario leans the cable *along the flight direction* (the payload lagging, then
# following the quadrotor through).  That is the affordable way: the payload's speed changes
# by a couple of m/s and no sideways room is needed.  A sideways swing needs the same hold,
# which costs ~5 m/s of lateral speed and ~1.5 m of sideways travel -- more than this window
# is wide, so it is not an alternative here.
#
# Bounds.  Wider than the mazes', and each one is set by the manoeuvre: |a| ~ 11 m/s^2 for the
# lean, hence +-14; jerk +-70, because the lean has to be built inside the ~0.2 m before the
# quadrotor reaches the wall (the 0 -> 11 ramp is 0.16 s); speed +-7, because the payload
# crosses at 3-6 m/s and has to stop in the 3 m after the wall.
#
# Warm start.  The global planner is off: the A* branch is a 2-D search and the sill and
# lintel span the whole y range, so it sees a solid wall and finds no path.  payload_pos_init
# / payload_vel_init / payload_input_init below hold the swing at the horizon's own 0.09 s
# knot spacing (96 knots over 4.28 s).  Regenerate them with
#     POLYFLY_DIR=$(pwd) PYTHONPATH=src python3 tests/window_swing_check.py --write
# which re-derives the programme and re-checks it before touching the file.
#
# Solver behaviour on this scenario (2026-10-13, this repo's OCP, IPOPT without HSL): it
# converges in ~135 iterations / ~25 s, but NOT to the swing.  It flies the payload through
# with the cable vertical (-9 deg), which the checker rejects: 12 of 330 dense samples
# collide, and the trajectory clears only 0.019 m where the margin asks for 0.10.
# The OCP's dual-form collision constraint reports 0.100 m (exactly the margin) for the same
# poses -- it overstates the true clearance by several cm here, more than the 0.087 m by which
# a vertical pass misses this window -- so the solver can satisfy its own constraints without
# swinging.  Tightening the window further pushes the *legitimate* lean past 55 deg and
# |a| > 15 m/s^2, so the two effects cannot be separated by geometry alone at this scale.
# tests/window_ocp_check.py re-rolls the solution with the OCP's own dynamics and validates
# every sample, which is what catches this; run it whenever this scenario is used to judge a
# change to the collision constraints.

